<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="DerinSplit – Premium niche parfüm topluluğu (UI Demo)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DerinSplit">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="manifest" href="manifest.json">
  <title>DerinSplit – UI Demo</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0A0A0A; }
    .splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #1a1a1a 0%, #000 80%);
      color: #D4AF37; font-family: Georgia, serif; letter-spacing: 4px;
    }
    .splash .word { font-size: 22px; }
    .splash .tag { font-size: 10px; color: #808080; margin-top: 8px; letter-spacing: 4px; }
  </style>
</head>
<body>
  <div id="splash" class="splash">
    <div class="word">DERİN  SPLIT</div>
    <div class="tag">PREMIUM PARFÜM TOPLULUĞU</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
