[package]
name = "promptfixer-sidekick"
version = "1.0.0"
description = "Floating prompt optimiser shell for PromptFixer Sidekick"
edition = "2021"
rust-version = "1.74"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "system-tray",
  "global-shortcut-all",
  "clipboard-all",
  "window-all"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
