[package]
name = "promptready-os"
version = "0.1.0"
description = "PromptReady OS — desktop shell"
edition = "2021"
rust-version = "1.74"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [
  "system-tray",
  "global-shortcut-all",
  "clipboard-all",
  "shell-open",
  "window-all"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
