# Netlify deploy config for DerinSplit Web MVP.
#
# Connect this repo (subdirectory: derinsplit_web_mvp) at
# https://app.netlify.com/start and Netlify will use these settings.

[build]
  base    = "derinsplit_web_mvp"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
